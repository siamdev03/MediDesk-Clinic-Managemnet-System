# Render Blueprint – New ▸ Blueprint ▸ select this repo. Fill the 3 "sync: false" values when asked.
services:
  - type: web
    name: medidesk
    runtime: node
    region: singapore
    plan: starter            # free plan sleeps and has no disk – do not use it for a clinic
    buildCommand: npm install --prefix server && npm install --include=dev --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES
        value: 7d
      - key: TIMEZONE
        value: Asia/Dhaka
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: AUTO_BACKUP
        value: "true"
      - key: BACKUP_HOUR
        value: "2"
      - key: BACKUP_KEEP
        value: "7"
      - key: MONGO_URI        # Atlas string, e.g. mongodb+srv://medidesk:PASS@cluster0.xxxxx.mongodb.net/medidesk?retryWrites=true&w=majority
        sync: false
      - key: CLIENT_ORIGIN    # https://medidesk.onrender.com  (your service URL)
        sync: false
      - key: PUBLIC_URL       # same URL
        sync: false