# Render Blueprint – New ▸ Blueprint ▸ select this repo. Fill the 3 "sync: false" values when asked.
# FREE-PLAN TEST VERSION. For a real clinic switch back to: plan: starter + disk block + UPLOAD_DIR/BACKUP_DIR.
services:
  - type: web
    name: medidesk
    runtime: node
    region: singapore
    plan: free               # free = sleeps after 15 min idle, no disk. Use "starter" for a real clinic
    buildCommand: npm install --prefix server && npm install --include=dev --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES
        value: 7d
      - key: TIMEZONE
        value: Asia/Dhaka
      - key: AUTO_BACKUP
        value: "true"
      - key: BACKUP_HOUR
        value: "2"
      - key: BACKUP_KEEP
        value: "7"
      - key: MONGO_URI        # Atlas string, e.g. mongodb+srv://medidesk:PASS@cluster0.xxxxx.mongodb.net/medidesk?retryWrites=true&w=majority
        sync: false
      - key: CLIENT_ORIGIN    # https://medidesk.onrender.com  (your service URL)
        sync: false
      - key: PUBLIC_URL       # same URL
        sync: false